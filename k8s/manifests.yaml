apiVersion: v1
kind: Namespace
metadata:
  name: yard-support-ticket-triage-live
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: yard-support-ticket-triage-live
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - image: redis:7-alpine
        name: redis
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: yard-support-ticket-triage-live
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: orchestrator
    yard-system: yard-support-ticket-triage-live
  name: orchestrator
  namespace: yard-support-ticket-triage-live
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
        yard-system: yard-support-ticket-triage-live
    spec:
      containers:
      - env:
        - name: YARD_SYSTEM_ID
          value: 3f1c2295-bb97-4e5f-a092-373d067dcf12
        - name: YARD_AGENT_ENDPOINTS
          value: '{"classify": "http://triage-classifier:9000", "sentiment": "http://triage-sentiment:9000",
            "respond": "http://triage-responder:9000"}'
        image: agentyard-engine:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
        name: orchestrator
        ports:
        - containerPort: 9000
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: yard-support-ticket-triage-live
spec:
  ports:
  - nodePort: 30527
    port: 9000
    targetPort: 9000
  selector:
    app: orchestrator
  type: NodePort
